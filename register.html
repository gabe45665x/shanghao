<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="site.webmanifest">
  <title>註冊 · 新色 XINSE</title>
  <link rel="icon" href="img/logo-mark.jpg?v=s2">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><img src="img/logo-mark.jpg?v=s2" alt=""><span class="brand-word">新色</span><span class="brand-en">XINSE</span></a>
    </div>
  </header>
  <main class="auth-shell">
    <div class="auth-card">
      <p class="kicker">REGISTER</p>
      <h1>建立協議帳號</h1>
      <form id="register-form">
        <div class="form-field"><label for="username">使用者名稱</label><input id="username" autocomplete="username" required></div>
        <div class="form-field"><label for="password">密碼</label><input id="password" type="password" autocomplete="new-password" required></div>
        <div class="form-field"><label for="password2">確認密碼</label><input id="password2" type="password" autocomplete="new-password" required></div>
        <div class="form-field">
          <label for="captcha">驗證碼（示範請輸入 XINSE）</label>
          <input id="captcha" required maxlength="8" autocomplete="off">
        </div>
        <button class="btn btn-solid btn-full" type="submit">送出</button>
      </form>
      <p class="form-help" style="margin-top:16px">已有帳號？<a href="login.html">去登入</a></p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
