<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="site.webmanifest">
  <title>刊登檔期 · TAIWAN</title>
  <link rel="icon" href="img/logo-mark.jpg?v=s2">
  <link rel="stylesheet" href="css/tokens.css?v=gold13">
  <link rel="stylesheet" href="css/base.css?v=gold13">
  <link rel="stylesheet" href="css/components.css?v=gold13">
  <link rel="stylesheet" href="css/pages.css?v=gold13">
  <link rel="stylesheet" href="css/mobile.css?v=gold13">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("xinse-theme") || "dark";
        if (t === "light" || t === "ice") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><img src="img/logo-mark.jpg?v=s2" alt=""><span class="brand-word">TAIWAN</span><span class="brand-en">TAIWAN</span></a>
      <a class="btn btn-ghost" href="account.html">會員中心</a>
    </div>
  </header>
  <main class="wrap" style="padding:40px 0 120px;max-width:640px">
    <p class="kicker">PUBLISH</p>
    <h1 style="margin:8px 0 8px">刊登檔期</h1>
    <p class="lede">工坊與訊號可自助送審；認證檔走申請審核。此表為示範，不會真的上架。</p>
    <form id="publish-form" style="margin-top:32px">
      <div class="form-field">
        <label for="ptype">類型</label>
        <select id="ptype" required>
          <option value="studio">獨立工坊</option>
          <option value="signal">限時訊號</option>
          <option value="select">申請認證檔</option>
        </select>
      </div>
      <div class="form-field"><label for="pname">檔名</label><input id="pname" required></div>
      <div class="form-field">
        <label for="pcity">城市</label>
        <select id="pcity" required>
          <option>台北</option><option>台中</option><option>新竹</option><option>桃園</option><option>新北</option><option>高雄</option><option>台南</option>
        </select>
      </div>
      <div class="form-field"><label for="pclaim">一句主張</label><input id="pclaim" maxlength="40"></div>
      <div class="form-field"><label for="pbio">自介</label><textarea id="pbio"></textarea></div>
      <div class="form-field"><label for="pbounds">明確界線</label><input id="pbounds" placeholder="例如：錄影、站外轉帳"></div>
      <p class="form-help">送出即表示你已年滿 18 歲，並同意服務條款。金流與真實審核不在示範範圍。</p>
      <button class="btn btn-solid" type="submit">送審</button>
    </form>
  </main>
  <script src="js/data.js?v=akx9"></script>
  <script src="js/app.js?v=akx9"></script>
</body>
</html>
