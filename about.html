      <p class="kicker">ABOUT</p>
      <h1>關於新色</h1>
      <p>新色（XINSE）是一份給 25–45 歲都會使用者的私人檔期協議介面。我們用規格、界線與邀約狀態取代論壇式叫賣。</p>
      <h2 id="why">為什麼做新色</h2>
      <p>夜間媒合如果只剩照片堆疊，使用者會用噪音做決定。新色把「能不能邀約」收成四步：選城、讀檔、核對、送出。</p>
      <h2 id="what">三條線</h2>
      <ul>
        <li>認證檔期：規格最完整，走審核上架。</li>
        <li>獨立工坊：自助刊登的私人工作室。</li>
        <li>限時訊號：短期、巡迴、週末。</li>
      </ul>
      <h2 id="not">這站不是什麼</h2>
      <p>這是設計示範。沒有真實交易、沒有真實名單、沒有後端金流。營運數據與價格均標【待你確認】。</p>
