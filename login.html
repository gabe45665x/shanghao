<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="site.webmanifest">
  <title>登入 · 飛田新天地</title>
  <link rel="icon" href="img/logo-mark.jpg?v=s2">
  <link rel="stylesheet" href="css/tokens.css?v=gold10">
  <link rel="stylesheet" href="css/base.css?v=gold10">
  <link rel="stylesheet" href="css/components.css?v=gold10">
  <link rel="stylesheet" href="css/pages.css?v=gold10">
  <link rel="stylesheet" href="css/mobile.css?v=gold10">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("xinse-theme") || "dark";
        if (t === "light" || t === "ice") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><img src="img/logo-mark.jpg?v=s2" alt=""><span class="brand-word">飛田新天地</span><span class="brand-en">TAIWAN</span></a>
    </div>
  </header>
  <main class="auth-shell">
    <div class="auth-card">
      <p class="kicker">SIGN IN</p>
      <h1>登入協議帳號</h1>
      <form id="login-form">
        <div class="form-field"><label for="username">使用者名稱</label><input id="username" autocomplete="username" required></div>
        <div class="form-field"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-solid btn-full" type="submit">送出</button>
      </form>
      <p class="form-help" style="margin-top:16px">
        還沒有帳號？<a href="register.html">註冊帳號</a> ／ <a href="recover.html">找回密碼</a>
      </p>
    </div>
  </main>
  <script src="js/data.js?v=akx8"></script>
  <script src="js/app.js?v=akx8"></script>
</body>
</html>
