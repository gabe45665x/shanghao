      <p class="kicker">GUIDE</p>
      <h1>使用方式</h1>
      <p>四步與首頁流程相同，名稱全站一致。</p>
      <h2 id="s1">01 選城</h2>
      <p>用城市協定列過濾。沒有示範檔的城市會顯示空狀態，不會用別的城市充數。</p>
      <h2 id="s2">02 讀檔</h2>
      <p>三條線進同一種詳情殼。看肖像、場景、主張。</p>
      <h2 id="s3">03 核對</h2>
      <p>讀規格、可協商項、明確界線。方案：1s2500/30min、2s3500/60min。</p>
      <h2 id="s4">04 邀約</h2>
      <p>未登入會帶到登入／註冊，完成後回流原檔。已登入且檔期開放會顯示「邀約已送出」；未開放會顯示「此時段未開放」。</p>
      <p><a class="btn btn-solid" href="select.html">瀏覽認證檔</a></p>
