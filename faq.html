<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="site.webmanifest">
  <title>常見問題 · 飛田新天地</title>
  <link rel="icon" href="img/logo-mark.jpg?v=s2">
  <link rel="stylesheet" href="css/tokens.css?v=gold7">
  <link rel="stylesheet" href="css/base.css?v=gold7">
  <link rel="stylesheet" href="css/components.css?v=gold7">
  <link rel="stylesheet" href="css/pages.css?v=gold7">
  <link rel="stylesheet" href="css/mobile.css?v=gold7">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("xinse-theme") || "dark";
        if (t === "light" || t === "ice") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><img src="img/logo-mark.jpg?v=s2" alt=""><span class="brand-word">飛田新天地</span><span class="brand-en">TAIWAN</span></a>
    </div>
  </header>
  <main class="wrap" style="padding:48px 0 80px">
    <p class="kicker">FAQ</p>
    <h1 style="margin:8px 0 24px">常見問題</h1>
    <div class="faq-list">
      <details class="faq-item" open>
        <summary>這是真實可約平台嗎？</summary>
        <p>名單、方案與加值以各檔頁面為準。邀約前請先對齊規格與界線。</p>
      </details>
      <details class="faq-item">
        <summary>為什麼一定要帳號才能邀約？</summary>
        <p>邀約綁協議帳號，才能在會員中心看到紀錄。示範登入存在 sessionStorage。</p>
      </details>
      <details class="faq-item">
        <summary>被要求轉帳怎麼辦？</summary>
        <p>不要付。到安全準則頁，停止對話。</p>
      </details>
      <details class="faq-item">
        <summary>認證、工坊、訊號差在哪？</summary>
        <p>認證規格最完整；工坊是自助私人工作室；訊號是短期或巡迴。</p>
      </details>
      <details class="faq-item">
        <summary>價格呢？</summary>
        <p>【待你確認】。示範站不公布行情，避免假裝有真實交易。</p>
      </details>
      <details class="faq-item">
        <summary>如何刊登？</summary>
        <p>登入後走刊登檔期表單。示範只做到送審提示。</p>
      </details>
    </div>
  </main>
  <footer class="site-footer"><div class="wrap"><p class="legal-note"><a href="index.html">回首頁</a></p></div></footer>
  <script src="js/app.js"></script>
</body>
</html>
